<h1>第一章 去银行</h1>
<p>我们今天上午去银行办事。银行里的人很多，大家都在排队等候。</p>
<p>他说和尚未必知道这件事，但是我觉得这不是一个简单的问题。</p>
<p>学生们在图书馆里认真学习中文，因为他们明年想去中国旅行。老师告诉他们，多读书是提高阅读水平最好的方法。</p>
<p>读完这本小说以后，她把自己不认识的词语都写在笔记本上，每天晚上复习一遍。慢慢地，她发现自己能看懂的内容越来越多了。</p>
